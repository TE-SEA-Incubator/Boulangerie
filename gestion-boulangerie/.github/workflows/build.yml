name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean package --file gestion-boulangerie/pom.xml
      
    - name: Install WiX Toolset
      run: |
        # Requis pour jpackage afin de créer des installateurs .exe/.msi
        choco install wixtoolset -y

    - name: Create Windows Executable
      shell: bash
      run: |
        jpackage --name "GestionBoulangerie" \
                 --input gestion-boulangerie/target \
                 --main-jar gestion-boulangerie-1.0.0.jar \
                 --main-class com.boulangerie.MainApp \
                 --type exe \
                 --win-dir-chooser \
                 --win-menu \
                 --win-shortcut \
                 --dest output
      
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: GestionBoulangerie-Installer
        path: output/*.exe
